name: Build Custom NZP csprogs.dat (Fast)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      # 1. Dein geforktes Repository auschecken
      - name: Checkout your fork
        uses: actions/checkout@v4

      # 2. Das offizielle Toolbox-Setup laden
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch

      # 3. Deinen Commit in das Toolbox-Verzeichnis zwingen
      - name: Select your commit
        env:
          QUAKEC_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          cd /workspace/repos/quakec
          git remote set-url origin https://github.com/${GITHUB_REPO}.git
          git fetch origin main
          git checkout --detach "$QUAKEC_SHA"
          echo "QuakeC commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # 4. FTE-Erweiterungen von der FUNKTIONIERENDEN URL herunterladen
      - name: Setup FTE Extensions
        run: |
          cd /workspace/repos/quakec
          
          # Lade die offizielle fteextensions.qc von der korrekten URL
          curl -L -o progs/fteextensions.qc http://triptohell.info/moodles/fteqcc/fteextensions.qc
          
          # Sicherheitscheck: Prüfe, ob die Datei tatsächlich QuakeC-Code enthält und kein 404-Fehler ist
          if ! grep -q "This file was generated by FTE" progs/fteextensions.qc; then
            echo "FEHLER: Download der fteextensions.qc fehlgeschlagen oder Datei ungültig."
            head -n 5 progs/fteextensions.qc
            exit 1
          fi
          
          # Füge die Include-Anweisung ganz oben in die .src-Dateien ein (CSQC und SSQC)
          # (Auch wenn SSQC nicht kompiliert wird, schadet es nicht, es korrekt zu haben)
          if ! grep -q '#include "fteextensions.qc"' progs/csqc.src; then
            sed -i '1i #include "fteextensions.qc"' progs/csqc.src
          fi
          if ! grep -q '#include "fteextensions.qc"' progs/ssqc.src; then
            sed -i '1i #include "fteextensions.qc"' progs/ssqc.src
          fi
          
          echo "FTE Extensions erfolgreich heruntergeladen und eingebunden."

      # 5. Patches anwenden
      - name: Apply Patches
        run: |
          cd /workspace/repos/quakec
          mkdir -p scripts
          cp $GITHUB_WORKSPACE/scripts/apply_nzp_m9_patches.py scripts/
          python3 scripts/apply_nzp_m9_patches.py

      # 6. Build-Skript manipulieren: SSQC überspringen, nur CSQC bauen
      - name: Skip SSQC Compile
        run: |
          cd /workspace/repos/quakec
          # Lösche die Zeile, die den Server-Code (ssqc) kompiliert
          sed -i '/compile_progs "ssqc"/d' tools/qc-compiler-gnu.sh
          
          # Füge den CSQC-Compile-Befehl hinzu, falls er noch nicht existiert
          if ! grep -q 'compile_progs "csqc"' tools/qc-compiler-gnu.sh; then
            sed -i '/setup;/a \	compile_progs "csqc" "Vril CSQC" "-O3 -Ono-compound_jumps ${TEST_FLAG} -Wall"' tools/qc-compiler-gnu.sh
          fi
          
          echo "Build-Skript angepasst: SSQC wird übersprungen."
          grep compile_progs tools/qc-compiler-gnu.sh

      # 7. Kompilieren (Nutzt das modifizierte Skript)
      - name: Compile
        run: /entrypoint.sh build-quakec

      # 8. Nur die fertige csprogs.dat hochladen
      - name: Upload csprogs.dat
        uses: actions/upload-artifact@v4
        with:
          name: nzp-csprogs-patched
          path: /workspace/repos/quakec/build/standard/csprogs.dat
          if-no-files-found: error
