name: Build NZP csprogs.dat (Patched QuakeC)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-quakec:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Dein geforktes QuakeC-Repository auschecken ────────────────
      - name: Checkout kattimasen-ops/quakec-m9
        uses: actions/checkout@v4
        with:
          repository: kattimasen-ops/quakec-m9
          ref: main
          path: quakec-m9

      # ── 2. Patches anwenden ─────────────────────────────────────────
      - name: Apply NZP-M9 patches
        run: |
          set -euo pipefail
          cd quakec-m9
          if [ ! -f scripts/apply_nzp_m9_patches.py ]; then
            echo "FEHLER: scripts/apply_nzp_m9_patches.py fehlt im Repo."
            exit 1
          fi
          python3 scripts/apply_nzp_m9_patches.py

      # ── 3. QuakeC kompilieren (nur CSQC für csprogs.dat) ───────────
      - name: Compile QuakeC (fteqcc)
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/quakec-m9 \
            ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update && apt-get install -y --no-install-recommends \
                python3 python3-pip build-essential git ca-certificates

              echo "=== Installiere Python-Abhängigkeiten ==="
              pip3 install fastcrc colorama panda3d

              echo "=== Generiere Hash-Tabelle ==="
              python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc

              FTEQCC_BIN="bin/fteqcc-cli-lin"
              if [ ! -x "${FTEQCC_BIN}" ]; then
                echo "FEHLER: ${FTEQCC_BIN} nicht gefunden."
                ls -la bin/ || true
                exit 1
              fi

              mkdir -p build

              # ---------------------------------------------------------
              # HIER WIRD NUR CSQC KOMPILIERT, UM NUR csprogs.dat ZU BAUEN
              # ---------------------------------------------------------
              echo "=== Kompiliere CSQC (Client) ==="
              if [ -f "progs/csqc.src" ]; then
                ${FTEQCC_BIN} -O3 -Ono-compound_jumps -Wall -srcfile progs/csqc.src
              elif [ -f "progs/csprogs.src" ]; then
                ${FTEQCC_BIN} -O3 -Ono-compound_jumps -Wall -srcfile progs/csprogs.src
              else
                echo "FEHLER: Keine CSQC .src Datei gefunden!"
                find . -name "*.src"
                exit 1
              fi

              echo ""
              echo "=== Ergebnis: erzeugte .dat-Dateien ==="
              find . -maxdepth 4 -name "*.dat" -exec ls -la {} \;
            '

      # ── 4. Nur csprogs.dat als Artefakt hochladen ───────────────────
      - name: Upload csprogs.dat
        uses: actions/upload-artifact@v4
        with:
          name: nzp-csprogs-patched
          path: quakec-m9/build/**/csprogs.dat
          if-no-files-found: error
