name: Build Custom NZP csprogs.dat (Fast)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      # 1. Dein geforktes Repository direkt in den Workspace der Toolbox klonen
      - name: Clone your fork into toolbox workspace
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # Stelle sicher, dass das Zielverzeichnis existiert
          mkdir -p /workspace/repos/quakec
          cd /workspace/repos/quakec
          
          # Initialisiere das Repo und hole DEINEN Fork
          git init
          git remote add origin https://github.com/${GITHUB_REPO}.git
          git fetch --depth 1 origin ${GITHUB_SHA}
          git checkout FETCH_HEAD
          
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "QuakeC commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # 2. FTE-Erweiterungen herunterladen und einbinden
      - name: Setup FTE Extensions
        run: |
          cd /workspace/repos/quakec
          
          curl -L -o progs/fteextensions.qc http://triptohell.info/moodles/fteqcc/fteextensions.qc
          
          if ! grep -q "This file was generated by FTE" progs/fteextensions.qc; then
            echo "FEHLER: Download der fteextensions.qc fehlgeschlagen."
            head -n 5 progs/fteextensions.qc
            exit 1
          fi
          
          if ! grep -q '#include "fteextensions.qc"' progs/csqc.src; then
            sed -i '1i #include "fteextensions.qc"' progs/csqc.src
          fi
          if ! grep -q '#include "fteextensions.qc"' progs/ssqc.src; then
            sed -i '1i #include "fteextensions.qc"' progs/ssqc.src
          fi
          
          echo "FTE Extensions erfolgreich heruntergeladen und eingebunden."

      # 3. Patches anwenden
      - name: Apply Patches
        run: |
          cd /workspace/repos/quakec
          mkdir -p scripts
          cp $GITHUB_WORKSPACE/scripts/apply_nzp_m9_patches.py scripts/
          python3 scripts/apply_nzp_m9_patches.py

      # 4. Build-Skript manipulieren: SSQC überspringen, nur CSQC bauen
      - name: Skip SSQC Compile
        run: |
          cd /workspace/repos/quakec
          
          # Entferne den SSQC-Compile-Befehl
          sed -i '/compile_progs "ssqc"/d' tools/qc-compiler-gnu.sh
          
          # Füge den CSQC-Compile-Befehl hinzu, falls er fehlt
          if ! grep -q 'compile_progs "csqc"' tools/qc-compiler-gnu.sh; then
            sed -i '/setup;/a \	compile_progs "csqc" "Vril CSQC" "-O3 -Ono-compound_jumps ${TEST_FLAG} -Wall"' tools/qc-compiler-gnu.sh
          fi
          
          echo "Build-Skript angepasst: SSQC wird übersprungen."
          grep compile_progs tools/qc-compiler-gnu.sh

      # 5. Kompilieren (ohne den fehlerhaften fetch-Schritt)
      - name: Compile CSQC
        run: |
          cd /workspace/repos/quakec
          ./tools/qc-compiler-gnu.sh

      # 6. Nur die fertige csprogs.dat hochladen
      - name: Upload csprogs.dat
        uses: actions/upload-artifact@v4
        with:
          name: nzp-csprogs-patched
          path: /workspace/repos/quakec/build/standard/csprogs.dat
          if-no-files-found: error
