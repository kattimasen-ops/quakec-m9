name: Build NZP PortMaster Engine (RK3326 / ArkOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-portmaster-package:
    runs-on: ubuntu-latest
    steps:
      # ── Repos ────────────────────────────────────────────────────────
      - name: Checkout nzp-team/fteqw Engine Repository
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master                              # unverändert: neuester Stand
          submodules: recursive
          fetch-depth: 0
          path: fteqw                              # NEU: eigener Unterordner

      - name: Checkout kattimasen-ops/quakec-m9 Game-Code
        uses: actions/checkout@v4
        with:
          repository: kattimasen-ops/quakec-m9
          ref: main                                # TODO: falls branch "master" heisst, hier ändern
          path: quakec-m9

      # ── Erkennung: zeigt uns, wie quakec-m9 gebaut wird ──────────────
      - name: Detect quakec-m9 build structure
        run: |
          echo "=== quakec-m9 root ==="
          ls -la quakec-m9/ || true
          echo ""
          echo "=== source/ ==="
          ls -la quakec-m9/source/ || true
          echo ""
          echo "=== *.src Dateien (Compile-Listen) ==="
          find quakec-m9 -maxdepth 4 -name "*.src" || true
          echo ""
          echo "=== Makefiles ==="
          find quakec-m9 -maxdepth 4 -iname "makefile" -o -iname "GNUmakefile" || true
          echo ""
          echo "=== Vorhandene .dat Dateien ==="
          find quakec-m9 -maxdepth 4 -name "*.dat" || true
          echo ""
          echo "=== Mitgeliefertes fteqcc ==="
          find quakec-m9 -maxdepth 4 -iname "fteqcc*" -type f || true

      # ── Patches anwenden ────────────────────────────────────────────
      - name: Apply NZP-M9 server-browser gamepad patches
        run: |
          set -euo pipefail
          cd quakec-m9
          if [ ! -f scripts/apply_nzp_m9_patches.py ]; then
            echo "FEHLER: scripts/apply_nzp_m9_patches.py fehlt im Repo."
            echo "Bitte das Patch-Skript committen, dann erneut starten."
            exit 1
          fi
          python3 scripts/apply_nzp_m9_patches.py

      # ── QEMU für ARM64-Emulation ────────────────────────────────────
      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3

      # ── Engine-Build (unverändert, nur -w /workspace/fteqw) ─────────
      - name: Compile FTE Engine in ARM64 Container
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}:/workspace" -w /workspace/fteqw \
            arm64v8/ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update && apt-get install -y --no-install-recommends \
                build-essential make git curl wget ca-certificates pkg-config perl \
                libsdl2-dev libgles2-mesa-dev libegl1-mesa-dev libasound2-dev zlib1g-dev

              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "*"

              if [ -f "engine/Makefile" ]; then
                echo "Located Makefile in engine/ directory."
                cd engine
              elif [ -f "Makefile" ]; then
                echo "Located Makefile in root directory."
              else
                MAKEFILE_PATH=$(find . -maxdepth 4 \( -iname "makefile" -o -iname "GNUmakefile" \) | head -n 1)
                if [ -n "${MAKEFILE_PATH}" ]; then
                  BUILD_DIR=$(dirname "${MAKEFILE_PATH}")
                  echo "Located Makefile at: ${MAKEFILE_PATH} (Directory: ${BUILD_DIR})"
                  cd "${BUILD_DIR}"
                else
                  echo "Error: Could not locate Makefile!"
                  ls -la
                  exit 1
                fi
              fi

              OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 -funsafe-math-optimizations -fno-math-errno -fno-trapping-math -fomit-frame-pointer -funroll-loops -pipe"

              make makelibs FTE_TARGET=linux_arm64 || true
              make m-rel \
                FTE_TARGET=linux_arm64 \
                FTE_CONFIG=nzportable \
                USE_SDL=2 \
                NO_X11=1 \
                NO_WAYLAND=1 \
                NO_VULKAN=1 \
                CPUOPTIMIZATIONS="${OPT_FLAGS}" \
                -j"$(nproc)"
            '

      # ── QuakeC-Build (x64 auf Host, mit Fallback-Ketten) ────────────
      - name: Compile QuakeC (fteqcc)
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/fteqw \
            ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y --no-install-recommends \
                build-essential make git ca-certificates

              git config --global --add safe.directory "*"

              # 1. fteqcc bauen
              echo "=== Versuche fteqcc zu bauen ==="
              if [ -f "engine/Makefile" ]; then cd engine; fi
              if make fteqcc -j"$(nproc)" 2>&1 | tail -n 20; then
                echo "make fteqcc: OK"
              else
                echo "make fteqcc: FEHLGESCHLAGEN, suche trotzdem nach binary"
              fi

              FTEQCC=$(find /workspace/fteqw -maxdepth 6 -name "fteqcc" -type f -executable 2>/dev/null | head -n 1)
              if [ -z "${FTEQCC}" ]; then
                echo "FEHLER: kein fteqcc gefunden."
                echo "Gefundene Kandidaten:"
                find /workspace/fteqw -maxdepth 6 -iname "*fteqcc*" -type f || true
                echo ""
                echo "Prüfe, ob quakec-m9 ein eigenes fteqcc hat:"
                find /workspace/quakec-m9 -maxdepth 4 -iname "fteqcc*" -type f || true
                exit 1
              fi
              echo "fteqcc: ${FTEQCC}"

              # 2. Alle .src-Dateien kompilieren (progs.dat, csprogs.dat, etc.)
              echo ""
              echo "=== Kompiliere alle .src-Dateien ==="
              COMPILED=0
              for SRC in $(find /workspace/quakec-m9 -maxdepth 4 -name "*.src"); do
                echo "--- $SRC ---"
                SRC_DIR=$(dirname "${SRC}")
                SRC_NAME=$(basename "${SRC}")
                ( cd "${SRC_DIR}" && "${FTEQCC}" "${SRC_NAME}" ) || {
                  echo "FEHLER beim Kompilieren von ${SRC}"
                  exit 1
                }
                COMPILED=$((COMPILED + 1))
              done

              if [ "${COMPILED}" -eq 0 ]; then
                echo "FEHLER: keine .src-Datei in quakec-m9 gefunden."
                exit 1
              fi

              echo ""
              echo "=== Ergebnis: erzeugte .dat-Dateien ==="
              find /workspace/quakec-m9 -maxdepth 4 -name "*.dat" -exec ls -la {} \;
            '

      # ── Stage ───────────────────────────────────────────────────────
      - name: Stage Complete PortMaster Artifact
        run: |
          set -euo pipefail
          mkdir -p dist/nzp

          # Engine-Binary
          BIN=$(find fteqw -maxdepth 6 -type f -executable \
                \( -iname "*arm64*" -o -iname "*aarch64*" -o -iname "fteqw*" -o -iname "*nzportable*" \) \
                ! -iname "*.sh" ! -name "fteqcc" | head -n 1)
          if [ -z "${BIN}" ]; then
            echo "Error: Engine binary not found after compilation!" && exit 1
          fi
          cp "${BIN}" dist/nzp/nzp.aarch64
          chmod +x dist/nzp/nzp.aarch64

          # QuakeC-Outputs
          DATS=$(find quakec-m9 -maxdepth 4 -name "*.dat")
          if [ -z "${DATS}" ]; then
            echo "Error: no .dat files produced by QuakeC build!" && exit 1
          fi
          for DAT in ${DATS}; do
            cp "${DAT}" dist/nzp/
          done

          echo "Final Artifact Contents:"
          ls -la dist/nzp/

      - name: Upload PortMaster Ready Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzp-m9pro-portmaster-complete
          path: dist/nzp/
          if-no-files-found: error
