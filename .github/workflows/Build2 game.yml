name: Build Custom NZP csprogs.dat

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      # 1. Dein geforktes Repository auschecken
      - name: Checkout your fork
        uses: actions/checkout@v4

      # 2. Das offizielle Toolbox-Setup laden
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch

      # 3. Deinen Commit in das Toolbox-Verzeichnis zwingen
      - name: Select your commit
        env:
          QUAKEC_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          cd /workspace/repos/quakec
          # Ändere die Remote-URL auf DEINEN Fork
          git remote set-url origin https://github.com/${GITHUB_REPO}.git
          git fetch origin main
          git checkout --detach "$QUAKEC_SHA"
          echo "QuakeC commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # 4. Patches anwenden & das Build-Skript für CSQC anpassen
      - name: Apply Patches & Enable CSQC
        run: |
          cd /workspace/repos/quakec
          
          # Kopiere dein Patch-Skript in das Build-Verzeichnis und führe es aus
          mkdir -p scripts
          cp $GITHUB_WORKSPACE/scripts/apply_nzp_m9_patches.py scripts/
          python3 scripts/apply_nzp_m9_patches.py
          
          # Zwinge das Build-Skript, auch den Client-Code (csqc) zu bauen
          sed -i '/compile_progs "ssqc"/a \	compile_progs "csqc" "Vril CSQC" "-O3 -Ono-compound_jumps ${TEST_FLAG} -Wall"' tools/qc-compiler-gnu.sh

      # 5. Kompilieren (nutzt das offizielle Toolbox-Skript)
      - name: Compile
        run: /entrypoint.sh build-quakec

      # 6. Die fertige csprogs.dat hochladen
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzp-csprogs-patched
          # Sucht die .dat Dateien im build-Ordner und lädt sie hoch
          path: |
            /workspace/repos/quakec/build/standard/csprogs.dat
            /workspace/repos/quakec/build/standard/progs.dat
          if-no-files-found: error
