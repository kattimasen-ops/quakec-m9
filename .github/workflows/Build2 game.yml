name: Build Custom NZP csprogs.dat

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      # 1. Dein geforktes Repository auschecken
      - name: Checkout your fork
        uses: actions/checkout@v4

      # 2. Das offizielle Toolbox-Setup laden
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch

      # 3. Deinen Commit in das Toolbox-Verzeichnis zwingen
      - name: Select your commit
        env:
          QUAKEC_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          cd /workspace/repos/quakec
          git remote set-url origin https://github.com/${GITHUB_REPO}.git
          git fetch origin main
          git checkout --detach "$QUAKEC_SHA"
          echo "QuakeC commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # 4. FTE-Erweiterungen herunterladen und einbinden
      - name: Setup FTE Extensions
        run: |
          cd /workspace/repos/quakec
          
          # Lade die offizielle fteextensions.qc herunter
          curl -L -o progs/fteextensions.qc https://raw.githubusercontent.com/fte-team/fteqw/master/quakec/fteextensions.qc
          
          # Füge die Include-Anweisung ganz oben in die .src-Dateien ein
          if ! grep -q '#include "fteextensions.qc"' progs/ssqc.src; then
            sed -i '1i #include "fteextensions.qc"' progs/ssqc.src
          fi
          if ! grep -q '#include "fteextensions.qc"' progs/csqc.src; then
            sed -i '1i #include "fteextensions.qc"' progs/csqc.src
          fi
          
          echo "FTE Extensions wurden erfolgreich eingebunden."

      # 5. Patches anwenden
      - name: Apply Patches
        run: |
          cd /workspace/repos/quakec
          mkdir -p scripts
          cp $GITHUB_WORKSPACE/scripts/apply_nzp_m9_patches.py scripts/
          python3 scripts/apply_nzp_m9_patches.py

      # 6. Kompilieren (nutzt das offizielle Toolbox-Skript)
      - name: Compile
        run: /entrypoint.sh build-quakec

      # 7. Die fertige csprogs.dat hochladen
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzp-csprogs-patched
          path: |
            /workspace/repos/quakec/build/standard/csprogs.dat
            /workspace/repos/quakec/build/standard/progs.dat
          if-no-files-found: error
