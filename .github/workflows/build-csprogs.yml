name: Forge Custom NZP csprogs.dat (Fast)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout your fork
        uses: actions/checkout@v4

      # 2. Python-Abhängigkeiten installieren
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas fastcrc colorama

      # 3. Patches anwenden (Menü- und Performance-Fixes)
      - name: Apply Patches
        run: |
          python3 scripts/apply_nzp_m9_patches.py

      # 4. FTE-Erweiterungen richtig einbinden
      - name: Setup FTE Extensions
        run: |
          # Entferne die inkompatible, heruntergeladene Datei, falls sie existiert
          rm -f progs/fteextensions.qc
          
          # Binde die repository-eigene fte.qc als erste Datei ein
          if ! grep -q '#include "client/defs/fte.qc"' progs/csqc.src; then
            sed -i '1i #include "client/defs/fte.qc"' progs/csqc.src
          fi
          echo "Die repository-eigene fte.qc wird verwendet."

      # 5. Direkt kompilieren (umgeht das fehlerhafte Skript)
      - name: Compile CSQC
        run: |
          # Ausführrechte für den Compiler sicherstellen
          chmod +x bin/fteqcc-cli-lin
          
          echo "=== Generiere Hash-Tabelle ==="
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc
          
          echo "=== Kompiliere CSQC (Manuell) ==="
          # Direkter Aufruf mit -o csprogs.dat, damit die Datei exakt so heißt
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/csqc.src -o csprogs.dat
          
          echo "=== Erzeugte .dat-Dateien im Workspace ==="
          find . -name "*.dat" -ls

      # 6. Artefakt hochladen
      - name: Upload Dat Files
        uses: actions/upload-artifact@v4
        with:
          name: nzp-csprogs-patched
          path: "**/*.dat"
          if-no-files-found: error
