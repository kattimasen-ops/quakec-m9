name: Build Custom NZP (csprogs, menu, progs)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  Compile-QC:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas fastcrc colorama

      - name: Verify Python Packages
        run: |
          python3 -c "import pandas; print('pandas', pandas.__version__)"
          python3 -c "import fastcrc; print('fastcrc ok')"
          python3 -c "import colorama; print('colorama ok')"

      - name: Apply Patches
        run: |
          python3 scripts/apply_nzp_m9_patches.py | tee patch_output.log

      - name: Generate Hash Table
        run: |
          mkdir -p source/server
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc

      - name: Compile QuakeC (CSQC, Menu, SSQC) with FTE-compatible flags
        run: |
          chmod +x bin/fteqcc-cli-lin
          mkdir -p build/fte build/standard

          # KORREKTE FLAGS für FTEQCC 6202:
          # -Tversion7  -> erzwingt KK Version 7 progs (FTE/KK-Format).
          # WICHTIG: KEIN -Kno-struct / -Kno-union, da fte.qc das struct-Keyword
          # für die JSON-Definitionen benötigt. Ohne diese Keywords bricht der
          # Compiler mit '"struct" is not a type' ab.
          FTEQCC_FLAGS="-O3 -Ono-compound_jumps -Wall -Tversion7"

          echo "=== Kompiliere Client (CSQC) ==="
          bin/fteqcc-cli-lin $FTEQCC_FLAGS -srcfile progs/csqc.src

          echo "=== Kompiliere Menu ==="
          bin/fteqcc-cli-lin $FTEQCC_FLAGS -srcfile progs/menu.src

          echo "=== Kompiliere Server (SSQC / progs.dat) ==="
          bin/fteqcc-cli-lin $FTEQCC_FLAGS -srcfile progs/ssqc.src

          echo "=== Suche erzeugte .dat-Dateien ==="
          find . -name "csprogs.dat" -o -name "menu.dat" -o -name "progs.dat" | sort

          CSQC_SRC=$(find . -name "csprogs.dat" | head -n 1)
          MENU_SRC=$(find . -name "menu.dat" | head -n 1)
          PROGS_SRC=$(find . -name "progs.dat" | head -n 1)

          if [ -z "$CSQC_SRC" ] || [ -z "$MENU_SRC" ] || [ -z "$PROGS_SRC" ]; then
            echo "FEHLER: Mindestens eine .dat-Datei wurde nicht erzeugt."
            echo "CSQC:  ${CSQC_SRC:-<fehlt>}"
            echo "MENU:  ${MENU_SRC:-<fehlt>}"
            echo "PROGS: ${PROGS_SRC:-<fehlt>}"
            exit 1
          fi

          cp "$CSQC_SRC"  build/fte/csprogs.dat
          cp "$MENU_SRC"  build/fte/menu.dat
          cp "$PROGS_SRC" build/standard/progs.dat

          cp build/fte/csprogs.dat      csprogs.dat
          cp build/fte/menu.dat         menu.dat
          cp build/standard/progs.dat   progs.dat

          echo "=== Ergebnis ==="
          ls -la csprogs.dat menu.dat progs.dat

      - name: Inspect progs.dat Header (Before Patch)
        run: |
          python3 - <<'PYEOF'
          import struct, os, sys

          path = "progs.dat"
          if not os.path.exists(path):
              sys.exit(f"FEHLER: {path} existiert nicht.")
          size = os.path.getsize(path)
          if size < 24:
              sys.exit(f"FEHLER: {path} ist nur {size} Bytes groß (mindestens 24 erwartet).")

          with open(path, "rb") as f:
              data = f.read(24)
          version, crc, ofs_statements, num_statements, ofs_globaldefs, num_globaldefs = struct.unpack("<6i", data)
          print(f"[VORHER] version        = {version}")
          print(f"[VORHER] crc            = {crc}")
          print(f"[VORHER] ofs_statements = {ofs_statements}")
          print(f"[VORHER] num_statements = {num_statements}")
          print(f"[VORHER] ofs_globaldefs = {ofs_globaldefs}")
          print(f"[VORHER] num_globaldefs = {num_globaldefs}")
          PYEOF

      - name: Set QuakeWorld Header (Version 7, CRC 54730)
        run: |
          python3 - <<'PYEOF'
          import struct, os, sys

          # WICHTIG: Die Referenz-Binary erwartet version 7 (FTE/KK-Format),
          # NICHT version 6 (QuakeWorld-Standard). Der CRC 54730 bleibt.
          FTE_VERSION = 7
          QW_CRC = 54730

          path = "progs.dat"
          if not os.path.exists(path):
              sys.exit(f"FEHLER: {path} existiert nicht.")
          if os.path.getsize(path) < 8:
              sys.exit(f"FEHLER: {path} ist zu klein, um den Header zu schreiben.")

          with open(path, "r+b") as f:
              f.seek(0x00)
              f.write(struct.pack("<i", FTE_VERSION))
              f.seek(0x04)
              f.write(struct.pack("<i", QW_CRC))

          with open(path, "rb") as f:
              version, crc = struct.unpack("<2i", f.read(8))
          if version != FTE_VERSION or crc != QW_CRC:
              sys.exit(f"FEHLER: Header nicht korrekt (version={version}, crc={crc})")
          print(f"[NACHHER] version = {version} (FTE/KK-Format)")
          print(f"[NACHHER] crc     = {crc} (PROGHEADER_CRC_QW)")
          PYEOF

      - name: Verify entityfields and CRC Recognition
        run: |
          python3 - <<'PYEOF'
          import struct, os, sys

          KNOWN_CRCS = {
              54730: "QuakeWorld (PROGHEADER_CRC_QW)",
              5927:  "NetQuake (PROGHEADER_CRC_NQ)",
              26940: "Prerelease",
              32401: "Tenebrae",
              38488: "Hexen2 (PROGHEADER_CRC_H2)",
              26905: "Hexen2 Mission Pack",
              22390: "CSQC (PROGHEADER_CRC_CSQC)",
              52195: "DarkPlaces CSQC",
              10020: "MenuQC (PROGHEADER_CRC_MENUQC)",
          }

          path = "progs.dat"
          if not os.path.exists(path) or os.path.getsize(path) < 60:
              sys.exit(f"FEHLER: {path} fehlt oder ist zu klein.")

          with open(path, "rb") as f:
              header = f.read(60)
          version, crc, _, _, _, _, _, _, _, _, _, _, _, _, entityfields = struct.unpack("<15i", header)

          print(f"version      = {version}")
          print(f"crc          = {crc}")
          print(f"entityfields = {entityfields}  (Referenz: 607)")

          if entityfields != 607:
              print(f"⚠️  WARNUNG: entityfields ist {entityfields}, nicht 607.")
              print("   Die alte Binary erwartet 607. Prüfe, ob ein Patch ein")
              print("   neues Entity-Feld hinzugefügt hat (z. B. .entity legs;).")
          else:
              print("✅ entityfields = 607 – kompatibel mit der alten Binary.")

          if crc in KNOWN_CRCS:
              print(f"✅ CRC {crc} wird erkannt als: {KNOWN_CRCS[crc]}")
          else:
              print(f"⚠️  CRC {crc} ist unbekannt – Engine könnte falschen Modus wählen.")
          PYEOF

          cp progs.dat qwprogs.dat
          echo "qwprogs.dat erstellt."

      - name: Stage MD3 Models
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ -d "assets/models/ai" ]; then
            cp assets/models/ai/*.md3 artifact/ 2>/dev/null || true
            ls -la artifact/ 2>/dev/null || true
          fi

      - name: Upload Compiled Files
        uses: actions/upload-artifact@v4
        with:
          name: nzp-patched-files
          path: |
            csprogs.dat
            menu.dat
            progs.dat
            qwprogs.dat
            artifact/*.md3
          if-no-files-found: error

      - name: Upload Patched Source Files
        uses: actions/upload-artifact@v4
        with:
          name: nzp-patched-source
          path: |
            source/
            patch_output.log
          if-no-files-found: error 
