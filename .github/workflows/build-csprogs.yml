name: creating Custom NZP (qwprogs, menu & csprogs)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas fastcrc colorama

      - name: Apply Patches
        run: |
          python3 scripts/apply_nzp_m9_patches.py

      - name: Compile QuakeC
        run: |
          chmod +x bin/fteqcc-cli-lin
          
          echo "=== Erstelle Build-Ordner (wegen #pragma progs_dat) ==="
          mkdir -p build/standard build/fte
          
          echo "=== Generiere Hash-Tabelle ==="
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc
          
          echo "=== Kompiliere Server (SSQC) ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/ssqc.src
          
          echo "=== Kompiliere Client (CSQC) ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/csqc.src
          
          echo "=== Kompiliere Menu ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/menu.src
          
          echo "=== Verschiebe fertige Dateien in den Hauptordner ==="
          # Der Server heißt im Artifact dann qwprogs.dat (so wie es das Spiel erwartet)
          cp build/standard/progs.dat qwprogs.dat
          cp build/fte/csprogs.dat csprogs.dat
          cp build/fte/menu.dat menu.dat
          
          echo "=== Ergebnis ==="
          ls -la qwprogs.dat csprogs.dat menu.dat

      - name: Upload Dat Files
        uses: actions/upload-artifact@v4
        with:
          name: nzp-patched-files
          path: |
            qwprogs.dat
            csprogs.dat
            menu.dat
          if-no-files-found: error
