name: Bastel Custom NZP csprogs.dat (Fast)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas fastcrc colorama

      - name: Apply Patches
        run: |
          python3 scripts/apply_nzp_m9_patches.py

      - name: Compile CSQC
        run: |
          chmod +x bin/fteqcc-cli-lin
          
          echo "=== Generiere Hash-Tabelle ==="
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc
          
          echo "=== Kompiliere CSQC (Manuell) ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/csqc.src -o csprogs.dat
          
          echo "=== Erzeugte .dat-Dateien im Workspace ==="
          find . -name "*.dat" -ls

      - name: Upload Dat Files
        uses: actions/upload-artifact@v4
        with:
          name: nzp-csprogs-patched
          path: "**/*.dat"
          if-no-files-found: error
