name: erschaffe Custom NZP (progs.dat, menu.dat & csprogs.dat)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas fastcrc colorama

      - name: Apply Patches
        run: |
          python3 scripts/apply_nzp_m9_patches.py

      - name: Compile QuakeC
        run: |
          chmod +x bin/fteqcc-cli-lin
          
          echo "=== Generiere Hash-Tabelle ==="
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc
          
          echo "=== Kompiliere progs.dat (Server / SSQC) ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/ssqc.src -o progs.dat
          
          echo "=== Kompiliere menu.dat ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/menu.src -o menu.dat
          
          echo "=== Kompiliere csprogs.dat ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/csqc.src -o csprogs.dat
          
          echo "=== Ergebnis ==="
          ls -la progs.dat menu.dat csprogs.dat

      - name: Upload Dat Files
        uses: actions/upload-artifact@v4
        with:
          name: nzp-patched-files
          path: |
            progs.dat
            menu.dat
            csprogs.dat
          if-no-files-found: error
