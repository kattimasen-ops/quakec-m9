name: Build Custom NZP (csprogs, menu, progs)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas fastcrc colorama

      - name: Verify Python Packages
        run: |
          python3 -c "import pandas; print('pandas', pandas.__version__)"
          python3 -c "import fastcrc; print('fastcrc ok')"
          python3 -c "import colorama; print('colorama ok')"

      - name: Apply Patches
        run: |
          python3 scripts/apply_nzp_m9_patches.py | tee patch_output.log

      - name: Generate Hash Table
        run: |
          mkdir -p source/server
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc

      - name: Compile QuakeC (CSQC, Menu, SSQC)
        run: |
          chmod +x bin/fteqcc-cli-lin
          mkdir -p build/fte build/standard

          echo "=== Kompiliere Client (CSQC) ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/csqc.src
          if [ ! -f build/fte/csprogs.dat ]; then
            echo "FEHLER: csprogs.dat wurde nicht erzeugt!"
            exit 1
          fi

          echo "=== Kompiliere Menu ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/menu.src
          if [ ! -f build/fte/menu.dat ]; then
            echo "FEHLER: menu.dat wurde nicht erzeugt!"
            exit 1
          fi

          echo "=== Kompiliere Server (SSQC / progs.dat) ==="
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/ssqc.src
          if [ ! -f build/standard/progs.dat ]; then
            echo "FEHLER: progs.dat wurde nicht erzeugt! (SSQC-Fehler?)"
            find build -name "*.dat" -exec ls -la {} \;
            exit 1
          fi

          echo "=== Verschiebe fertige Dateien ins Repo-Root ==="
          cp build/fte/csprogs.dat csprogs.dat
          cp build/fte/menu.dat menu.dat
          cp build/standard/progs.dat progs.dat

          echo "=== Ergebnis ==="
          ls -la csprogs.dat menu.dat progs.dat

      - name: Set QuakeWorld CRC in progs.dat (Ansatz A)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import struct

          QW_CRC = 54730  # PROGHEADER_CRC_QW – Standard-QuakeWorld-CRC
          path = "progs.dat"

          with open(path, "r+b") as f:
              # Quake dprograms_t Header:
              #   0x00: version (int32)
              #   0x04: crc     (int32)  <-- hier steht der CRC
              f.seek(0x04)
              f.write(struct.pack("<i", QW_CRC))

          # Verifikation: CRC erneut lesen
          with open(path, "rb") as f:
              f.seek(0x04)
              written = struct.unpack("<i", f.read(4))[0]

          if written != QW_CRC:
              raise SystemExit(f"FEHLER: CRC konnte nicht gesetzt werden (gelesen: {written})")

          print(f"CRC in {path} erfolgreich auf {written} (QuakeWorld) gesetzt.")
          PYEOF

          # Zusätzlich als qwprogs.dat bereitstellen (manche Setups erwarten diesen Namen)
          cp progs.dat qwprogs.dat

          echo "=== Ergebnis nach CRC-Patch ==="
          ls -la progs.dat qwprogs.dat

      - name: Stage MD3 Models
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ -d "assets/models/ai" ]; then
            cp assets/models/ai/*.md3 artifact/ 2>/dev/null || true
            ls -la artifact/ 2>/dev/null || true
          fi

      - name: Upload Compiled Files
        uses: actions/upload-artifact@v4
        with:
          name: nzp-patched-files
          path: |
            csprogs.dat
            menu.dat
            progs.dat
            qwprogs.dat
            artifact/*.md3
          if-no-files-found: error

      - name: Upload Patched Source Files
        uses: actions/upload-artifact@v4
        with:
          name: nzp-patched-source
          path: |
            source/
            patch_output.log
          if-no-files-found: error
