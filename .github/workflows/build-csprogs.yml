name: Baue Custom NZP csprogs.dat (Fast)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas fastcrc colorama

      - name: Apply Patches
        run: |
          python3 scripts/apply_nzp_m9_patches.py

      - name: Setup FTE Extensions
        run: |
          rm -f progs/fteextensions.qc
          if ! grep -q '#include "client/defs/fte.qc"' progs/csqc.src; then
            sed -i '1i #include "client/defs/fte.qc"' progs/csqc.src
          fi
          echo "Die repository-eigene fte.qc wird verwendet."

      - name: Skip SSQC Compile
        run: |
          sed -i '/compile_progs "ssqc"/d' tools/qc-compiler-gnu.sh
          
          if ! grep -q 'compile_progs "csqc"' tools/qc-compiler-gnu.sh; then
            sed -i '/setup;/a \	compile_progs "csqc" "Vril CSQC" "-O3 -Ono-compound_jumps ${TEST_FLAG} -Wall"' tools/qc-compiler-gnu.sh
          fi
          
          chmod +x tools/qc-compiler-gnu.sh
          chmod +x bin/fteqcc-cli-lin
          
          echo "SSQC wird übersprungen. CSQC wird gebaut:"
          grep compile_progs tools/qc-compiler-gnu.sh

      - name: Compile CSQC
        run: |
          ./tools/qc-compiler-gnu.sh
          
          echo "=== Erzeugte .dat-Dateien ==="
          find . -name "*.dat" -ls

      - name: Upload Dat Files
        uses: actions/upload-artifact@v4
        with:
          name: nzp-csprogs-patched
          path: "**/*.dat"
          if-no-files-found: error
