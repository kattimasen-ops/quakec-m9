name: Building Custom NZP csprogs.dat (Fast)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  Compile-QC:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout your fork
        uses: actions/checkout@v4

      # 2. Python-Abhängigkeiten installieren
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas fastcrc colorama

      # 3. Patches anwenden (Menü- und Performance-Fixes)
      - name: Apply Patches
        run: |
          python3 scripts/apply_nzp_m9_patches.py

      # 4. Direkt kompilieren (unter Verwendung der repo-eigenen fte.qc)
      - name: Compile CSQC
        run: |
          # Ausführrechte sicherstellen
          chmod +x bin/fteqcc-cli-lin
          
          echo "=== Generiere Hash-Tabelle ==="
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc
          
          echo "=== Kompiliere CSQC (Manuell) ==="
          # Der Pfad zur fte.qc wird von der csqc.src bereits korrekt aufgelöst
          bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/csqc.src -o csprogs.dat
          
          echo "=== Erzeugte .dat-Dateien im Workspace ==="
          find . -name "*.dat" -ls

      # 5. Artefakt hochladen
      - name: Upload csprogs.dat
        uses: actions/upload-artifact@v4
        with:
          name: nzp-csprogs-patched
          path: "**/*.dat"
          if-no-files-found: error
