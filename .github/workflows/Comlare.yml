name: Compare progs.dat (patched, crashes) vs qwprogs.dat.bak (working)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'progs.dat'
      - 'qwprogs.dat.bak'
      - 'scripts/compare_progs.py'
      - '.github/workflows/compare-progs.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify both files exist
        run: |
          set -euo pipefail
          for f in progs.dat qwprogs.dat.bak; do
            if [ ! -f "$f" ]; then
              echo "FEHLER: $f fehlt im Repo-Root."
              ls -la *.dat *.bak 2>/dev/null || true
              exit 1
            fi
            echo "$f: $(stat -c%s "$f") Bytes"
          done

      - name: Run comparison
        continue-on-error: true
        run: |
          python3 scripts/compare_progs.py progs.dat qwprogs.dat.bak | tee comparison_report.txt

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progs-comparison-report
          path: comparison_report.txt
          if-no-files-found: warn
